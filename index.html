<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Minimal Reader</title>
    <link id="manifest-link" rel="manifest">
    <style>
        :root {
            --bg-color: #F5F5DC;
            --text-color: #333333;
            --font-size: 21px;
            --line-height: 1.75;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
        }
        #app {
            display: flex; flex-direction: column;
            width: 100%; height: 100vh;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }
        #reader-container { flex: 1; position: relative; width: 100%; overflow: hidden; }
        #text-display {
            padding: 20px 25px;
            font-size: var(--font-size);
            line-height: var(--line-height);
            text-align: justify;
            white-space: pre-wrap;
            word-wrap: break-word;
            height: 100%;
            column-width: 100vw; /* 防止意外溢出 */
        }
        #touch-zones {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; z-index: 10;
        }
        #prev-zone { width: 30%; }
        #next-zone { width: 70%; }
        #status-bar {
            height: 44px; font-size: 12px; color: #888;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-top: 1px solid rgba(0,0,0,0.05);
        }
        #upload-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        .btn {
            padding: 16px 40px; background: #333; color: #fff;
            border-radius: 30px; font-size: 16px; border: none; font-weight: 500;
        }
        .hidden { display: none !important; }
        #loading { margin-top: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div id="app">
    <!-- 启动/上传页 -->
    <div id="upload-overlay">
        <h1 style="font-weight: 200; margin-bottom: 50px; letter-spacing: 2px;">Minimal Reader</h1>
        <button class="btn" onclick="document.getElementById('file-input').click()">打开本地 TXT</button>
        <input type="file" id="file-input" accept=".txt" style="display:none">
        <div id="loading" class="hidden">正在准备您的阅读体验...</div>
    </div>

    <!-- 阅读区 -->
    <div id="reader-container">
        <div id="text-display"></div>
        <div id="touch-zones">
            <div id="prev-zone"></div>
            <div id="next-zone"></div>
        </div>
    </div>

    <!-- 状态栏 -->
    <div id="status-bar">
        <span id="file-name" onclick="clearLibrary()" style="text-decoration: underline;">切换文档</span>
        <span id="page-info">0 / 0</span>
    </div>
</div>

<script>
    // --- 数据库逻辑 (IndexedDB) ---
    const DB_NAME = 'MinimalReaderDB';
    const STORE_NAME = 'books';
    
    function getDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
            request.onsuccess = e => resolve(e.target.result);
            request.onerror = e => reject(e);
        });
    }

    async function saveBook(name, content) {
        const db = await getDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(content, 'current_content');
        tx.objectStore(STORE_NAME).put(name, 'current_name');
    }

    async function getBook() {
        const db = await getDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        return {
            content: await new Promise(r => store.get('current_content').onsuccess = e => r(e.target.result)),
            name: await new Promise(r => store.get('current_name').onsuccess = e => r(e.target.result))
        };
    }

    // --- 阅读器逻辑 ---
    let state = { text: "", name: "", pages: [], cursor: 0 };

    window.onload = async () => {
        setupPWA();
        const book = await getBook();
        if (book.content && book.name) {
            initReader(book.name, book.content);
        }
    };

    document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading').classList.remove('hidden');
        const reader = new FileReader();
        reader.onload = async (evt) => {
            const buf = evt.target.result;
            const uint8 = new Uint8Array(buf);
            const decoder = new TextDecoder(detectEncoding(uint8));
            const text = decoder.decode(uint8).replace(/\r\n/g, '\n');
            
            await saveBook(file.name, text);
            initReader(file.name, text);
        };
        reader.readAsArrayBuffer(file);
    };

    function initReader(name, text) {
        state.name = name;
        state.text = text;
        document.getElementById('file-name').textContent = name;
        document.getElementById('upload-overlay').classList.add('hidden');
        
        // 渲染分页
        const container = document.getElementById('reader-container');
        const h = container.clientHeight - 40;
        const w = container.clientWidth - 50;
        
        // 启发式快速分页（兼容 iOS 高性能需求）
        state.pages = [];
        let start = 0;
        // 估算每页字数：高度/行高 * 宽度/字体大小 * 系数
        const step = Math.floor((h / 36) * (w / 20) * 1.8); 
        
        while (start < text.length) {
            state.pages.push({ start, end: start + step });
            start += step;
        }

        const savedPos = localStorage.getItem('pos_' + name) || 0;
        const startIdx = state.pages.findIndex(p => savedPos >= p.start && savedPos < p.end);
        render(startIdx !== -1 ? startIdx : 0);
    }

    function render(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        state.cursor = idx;
        const p = state.pages[idx];
        document.getElementById('text-display').textContent = state.text.substring(p.start, p.end);
        document.getElementById('page-info').textContent = `${idx + 1} / ${state.pages.length}`;
        localStorage.setItem('pos_' + state.name, p.start);
    }

    document.getElementById('prev-zone').onclick = () => render(state.cursor - 1);
    document.getElementById('next-zone').onclick = () => render(state.cursor + 1);

    function clearLibrary() {
        if(confirm("确定要关闭当前文档吗？")) {
            localStorage.clear();
            getDB().then(db => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).clear();
                location.reload();
            });
        }
    }

    function detectEncoding(uint8) {
        let i = 0;
        while (i < uint8.length) {
            if (uint8[i] <= 0x7F) { i++; continue; }
            if (uint8[i] >= 0xE0 && uint8[i] <= 0xEF && i+2 < uint8.length) {
                if (uint8[i+1] >= 0x80 && uint8[i+2] >= 0x80) { i += 3; continue; }
            }
            return 'gbk';
        }
        return 'utf-8';
    }

    function setupPWA() {
        const manifest = {
            "name": "Minimal Reader",
            "short_name": "极简阅读",
            "display": "standalone",
            "start_url": ".",
            "background_color": "#F5F5DC",
            "theme_color": "#F5F5DC",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3145/3145765.png", "sizes": "512x512", "type": "image/png"}]
        };
        document.getElementById('manifest-link').href = 'data:application/json;base64,' + btoa(JSON.stringify(manifest));
    }

    // 禁止 iOS 下拉刷新手势
    document.addEventListener('touchmove', e => {
        if (e.touches.length === 1) e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
